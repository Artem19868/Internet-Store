{% if search_query %}
<div class="round_pagination_inactive {%if page_number == active_page_number%}round_pagination_active{% endif %}">
        <a href="?page={{ page_number }}{% if request.GET.min_price and request.GET.max_price and request.GET.search_query%}&min_price={{min_price}}&max_price={{max_price}}&search={{search_query}}
        {%else%}&search={{search_query}}{% endif %}"  
        class="pagination_link">{{ page_number }}</a>
</div>
{% else %}
<div class="round_pagination_inactive {%if page_number == active_page_number%}round_pagination_active{% endif %}">
        <a href="?page={{ page_number }}{% if request.GET.min_price and request.GET.max_price%}&min_price={{min_price}}&max_price={{max_price}}{% endif %}"  
        class="pagination_link">{{ page_number }}</a>
</div>
{% endif %}
