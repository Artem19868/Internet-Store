{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="window-container">
        <h2 class="text-center mb-4">Login</h2>
            
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
            
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <input type="email" class="form-field" placeholder="Email" name="email" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-field mb-0" placeholder="Password" name="password" required>
            </div>
            <a href="{% url 'forgot_password' %}" class="login-register-link mb-1 mt-2">Forgot Password?</a></br>
            <button type="submit" class="btn-submit">Login</button>
        </form>
            
        <div class="mt-3 text-center">
            Don't have an account? <a href="{% url 'registration' %}" class="login-register-link">Register</a>
        </div>
    </div>
</div>
{% endblock content %}
